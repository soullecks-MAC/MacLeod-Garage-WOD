<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MacLeod HIIT Garage</title>
<meta name="theme-color" content="#171B21">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E9ED; --surface:#F7F8FA; --surface-2:#EDF0F3; --ink:#1D232B; --muted:#5F6976; --line:#CBD1D8;
  --green:#2F8F5B; --blue:#2463B8; --chalk:#D9D6CC; --yellow:#E2AE24; --red:#C9353B;
  --on-accent:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171B21; --surface:#222831; --surface-2:#2A313B; --ink:#E9EDF1; --muted:#9AA4B0; --line:#363F4A;
    --green:#3FA86D; --blue:#4A86D8; --chalk:#CFCBBE; --yellow:#EDBC3A; --red:#E0484E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171B21; --surface:#222831; --surface-2:#2A313B; --ink:#E9EDF1; --muted:#9AA4B0; --line:#363F4A;
  --green:#3FA86D; --blue:#4A86D8; --chalk:#CFCBBE; --yellow:#EDBC3A; --red:#E0484E;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px 96px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.brand{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:22px;letter-spacing:.02em}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* week strip of plates */
.strip{display:flex;justify-content:space-between;gap:6px;margin:14px 0 22px}
.mini{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0}
.mini .plate{width:44px;height:44px}
.mini span{font-size:13px;font-weight:600;color:var(--muted)}
.mini[aria-current="true"] span{color:var(--ink)}
.mini[aria-current="true"] .plate{transform:scale(1.12)}

/* plate disc */
.plate{--c:var(--blue);position:relative;border-radius:50%;background:var(--c);flex:none;transition:transform .2s}
.plate::before{content:"";position:absolute;inset:16%;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.plate::after{content:"";position:absolute;inset:40%;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.plate.hollow{background:transparent;box-shadow:inset 0 0 0 4px var(--c)}
.plate.hollow::before{border-color:var(--c);opacity:.4}
.plate .tick{position:absolute;inset:0;display:grid;place-items:center;z-index:2;color:var(--on-accent);font-weight:800;font-size:15px}
.t-movement{--c:var(--green)} .t-barbell{--c:var(--blue)} .t-yoga{--c:var(--chalk)} .t-body{--c:var(--yellow)} .t-heavy{--c:var(--red)}
.t-yoga .tick,.t-body .tick{color:#1D232B}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;margin-bottom:22px}
.hero .when{font-weight:600;color:var(--muted);font-size:15px}
.hero h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(52px,15vw,84px);line-height:.88;margin:6px 0 10px;letter-spacing:-.01em}
.hero .sub{font-size:17px;color:var(--muted);max-width:30ch}
.hero .big{width:clamp(108px,30vw,150px);height:clamp(108px,30vw,150px);animation:spin-in .9s cubic-bezier(.2,.8,.2,1) both}
.hero .big .tick{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:800;letter-spacing:.04em}
@keyframes spin-in{from{transform:rotate(-200deg) translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hero .big{animation:none}.plate{transition:none}}

/* blocks */
.block{background:var(--surface);border-radius:14px;padding:16px 18px;margin-bottom:12px;border-left:6px solid var(--c,var(--line))}
.block h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;margin:0 0 6px;line-height:1.1}
.block .fmt{font-weight:600;color:var(--muted);font-size:15px;margin:0 0 8px}
.block ul{margin:0;padding-left:20px}
.block li{margin:3px 0}
.block .note{margin:10px 0 0;font-size:14px;color:var(--muted)}
.go{margin-top:12px;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:10px 18px;font-weight:600}
.go svg{width:14px;height:14px}

/* log */
.log{background:var(--surface);border-radius:14px;padding:16px 18px;margin-top:20px}
.log label{display:block;font-weight:600;margin-bottom:6px}
.log input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.log .row{display:flex;gap:10px;margin-top:12px}
.done-btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:17px;background:var(--c,var(--blue));color:var(--on-accent)}
.t-yoga .done-btn,.t-body .done-btn{color:#1D232B}
.done-btn[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 2px var(--c)}
.saved{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.2em}

/* rest */
.rest{background:var(--surface);border-radius:14px;padding:22px 18px;margin-bottom:16px}
.rest h2{font-family:"Barlow Condensed",sans-serif;font-size:30px;margin:0 0 4px}
.link{border:0;background:none;padding:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* plan grid */
.week{margin-bottom:22px}
.week h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;margin:0 0 2px}
.week .focus{color:var(--muted);font-size:15px;margin:0 0 10px}
.day{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.day .plate{width:38px;height:38px}
.day b{display:block;font-weight:600}
.day small{color:var(--muted);font-size:14px}
.day[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--ink)}

.settings{margin-top:28px;background:var(--surface);border-radius:14px;padding:16px 18px}
.settings label{display:block;font-weight:600;margin-bottom:6px}
.settings input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.settings p{color:var(--muted);font-size:14px;margin:8px 0 0}
.back{border:0;background:none;padding:6px 0;font-weight:600;color:var(--muted)}

/* timer overlay */
.timer{position:fixed;inset:0;z-index:50;background:var(--c,var(--blue));color:var(--on-accent);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.timer.on{display:flex}
.timer.t-yoga,.timer.t-body{color:#1D232B}
.timer .tt{font-weight:600;font-size:16px;opacity:.85}
.timer .phase{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(26px,7vw,40px);line-height:1.1;margin-top:6px;min-height:2.2em}
.timer .clock{flex:1;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:clamp(110px,34vw,240px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer .meta{text-align:center;font-weight:600;font-size:18px;opacity:.85;margin-bottom:18px;min-height:1.5em}
.timer .ctrl{display:flex;gap:10px}
.timer .ctrl button{flex:1;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:18px;background:rgba(0,0,0,.22);color:inherit}
.timer .ctrl .primary{background:rgba(255,255,255,.92);color:#1D232B;flex:2}
.timer .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;border:0;background:rgba(0,0,0,.18);color:inherit;width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1}
.blocknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 18px}
.blocknav button{border:0;background:var(--surface);border-radius:999px;width:44px;height:44px;font-size:22px;font-weight:700}
.blocknav button:disabled{opacity:.35}
.blocknav div{text-align:center}
.blocknav b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:26px;line-height:1.1}
.blocknav small{color:var(--muted);font-size:14px}
.last{margin:8px 0 0;font-size:14px;color:var(--muted)}
.share-btn{width:100%;margin-top:10px;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:16px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:8px}
.share-btn svg{width:18px;height:18px}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet.on{display:flex}
.sheet img{max-width:100%;max-height:calc(100% - 90px);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.sheet .ctrl{display:flex;gap:10px;width:100%;max-width:420px}
.sheet .ctrl button{flex:1;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:17px;background:#2A313B;color:#E9EDF1}
.sheet .ctrl .primary{background:#E9EDF1;color:#1D232B;flex:2}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">MacLeod HIIT Garage</div>
    <div class="seg" role="group" aria-label="View">
      <button id="tabToday" aria-pressed="true">Today</button>
      <button id="tabPlan" aria-pressed="false">Plan</button>
    </div>
  </div>
  <main id="app"></main>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Share card">
  <img id="shareImg" alt="Workout share card">
  <div class="ctrl">
    <button id="sClose">Close</button>
    <button id="sSave">Save</button>
    <button class="primary" id="sShare">Share</button>
  </div>
</div>

<div class="timer" id="timer" role="dialog" aria-modal="true" aria-label="Workout timer">
  <button class="x" id="tClose" aria-label="Close timer">×</button>
  <div class="tt" id="tTitle"></div>
  <div class="phase" id="tPhase"></div>
  <div class="clock" id="tClock">0:00</div>
  <div class="meta" id="tMeta"></div>
  <div class="ctrl">
    <button id="tReset">Reset</button>
    <button class="primary" id="tStart">Start</button>
  </div>
</div>

<script>
/* ---------- helpers ---------- */
const B = (name, fmt, lines, timer, note) => ({name, fmt, lines, timer, note});
const amrap = m => ({mode:"amrap", min:m});
const ft = c => ({mode:"fortime", cap:c});
const cd = m => ({mode:"countdown", min:m});
const emom = (m, stations, every) => ({mode:"emom", min:m, stations, every:every||60});
const tab = (labels, o) => Object.assign({mode:"tabata", work:20, rest:10, rounds:8, sets:1, setRest:60, labels}, o||{});
const range = (n, f) => Array.from({length:n}, (_, i) => f(i));

const TYPES = {
  movement:{label:"Movement", cls:"t-movement"},
  barbell:{label:"HIIT: barbell + kettlebell", cls:"t-barbell"},
  yoga:{label:"Yoga", cls:"t-yoga"},
  body:{label:"HIIT: bodyweight", cls:"t-body"},
  heavy:{label:"Heavy strength", cls:"t-heavy"}
};
const DAYNAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
const DAYTYPES = ["movement","barbell","yoga","body","heavy"];
const PHASES = ["Foundation","Strength","Power","Peak","Test"];
const POS_FOCUS = ["Sets of eight to find your working weights.","Fives, adding weight each week.","Heavy triples.","Back off, recover, and retest."];

/* ---------- Tuesday pool: barbell + kettlebell ---------- */
const TUE = [
 {id:"t1", title:"Thruster grind", sub:"Snatch practice, then a 15-minute AMRAP.", blocks:[
  B("Power snatch","EMOM 10 minutes",["2 power snatches every minute","Light to moderate, about 75–95 lb"],emom(10,["2 power snatches"])),
  B("Workout","AMRAP 15 minutes",["10 kettlebell swings (40 lb)","8 thrusters (75–95 lb)","50 single-unders"],amrap(15),"Log rounds plus extra reps.")]},
 {id:"t2", title:"Push press ladder", sub:"Heavy triples, then a fast 21-15-9.", blocks:[
  B("Push press","5 × 3",["Build across sets to a heavy triple","Rest 90 sec"]),
  B("Workout","21-15-9 for time, 15 minute cap",["Kettlebell swings","Burpees","Thrusters (75–95 lb)"],ft(15),"21 of each, then 15, then 9.")]},
 {id:"t3", title:"Clean and press", sub:"Hang cleans, then four hard rounds.", blocks:[
  B("Hang power clean","EMOM 12 minutes",["3 hang power cleans every minute","Moderate, crisp reps"],emom(12,["3 hang power cleans"])),
  B("Workout","4 rounds for time, 18 minute cap",["12 kettlebell goblet squats","10 shoulder-to-overhead (95 lb)","15 kettlebell swings","60 single-unders"],ft(18))]},
 {id:"t4", title:"Snatch and pull", sub:"Build a heavy double, then a quick AMRAP.", blocks:[
  B("Power snatch","5 × 2",["Build across sets","Rest 90 sec"]),
  B("Workout","AMRAP 12 minutes",["5 power snatches (75 lb)","7 pull-ups","30 single-unders"],amrap(12))]},
 {id:"t5", title:"Deadlift and rope", sub:"Five rounds with built-in rest.", blocks:[
  B("Workout","5 rounds for time, 20 minute cap",["8 deadlifts (135 lb)","12 kettlebell swings","60 single-unders","Rest 1 minute"],ft(20),"Keep your back flat on every deadlift.")]},
 {id:"t6", title:"Front rack EMOM", sub:"Four stations, four rounds.", blocks:[
  B("Workout","EMOM 16 minutes (4 rounds)",["Minute 1: 6 front squats (95 lb)","Minute 2: 12 kettlebell swings","Minute 3: 10 push-ups","Minute 4: 6 pull-ups"],emom(16,["6 front squats","12 kettlebell swings","10 push-ups","6 pull-ups"]))]},
 {id:"t7", title:"Hang clean triplet", sub:"Heavy triples, then three rounds.", blocks:[
  B("Hang power clean","5 × 3",["Build to a heavy, fast triple"]),
  B("Workout","3 rounds for time, 15 minute cap",["10 hang power cleans (95 lb)","15 kettlebell goblet squats","20 sit-ups"],ft(15))]},
 {id:"t8", title:"Press and pull", sub:"Strict pressing, then a short AMRAP.", blocks:[
  B("Strict press","5 × 5",["Moderate to heavy, no leg drive","Rest 2 min"]),
  B("Workout","AMRAP 10 minutes",["5 push presses (95 lb)","10 kettlebell swings","5 pull-ups"],amrap(10))]},
 {id:"t9", title:"Barbell complex", sub:"Build a complex, then a swing Tabata.", blocks:[
  B("Complex","EMOM 10 minutes",["1 deadlift, 1 hang power clean, 1 front squat, 1 push press","Add weight every 2 minutes"],emom(10,["Deadlift, hang clean, front squat, push press"])),
  B("Finisher","Tabata, 4 minutes",["Kettlebell swings, 20 sec on, 10 sec off, 8 rounds"],tab(["Kettlebell swings"]),"Log your lowest round.")]},
 {id:"t10", title:"Garage chipper", sub:"One long list, top to bottom.", blocks:[
  B("Workout","For time, 20 minute cap",["50 single-unders","40 kettlebell swings","30 air squats","20 push presses (75 lb)","10 burpees","50 single-unders"],ft(20))]},
 {id:"t11", title:"Every three minutes", sub:"Five rounds, rest what’s left of each.", blocks:[
  B("Workout","Every 3 minutes for 5 rounds",["5 power cleans (95 lb)","10 burpees","15 kettlebell swings","Rest whatever time is left"],emom(15,["5 cleans, 10 burpees, 15 swings"],180),"Log your slowest round.")]},
 {id:"t12", title:"Thrusters and pull-ups", sub:"Alternating minutes, then a quick finisher.", blocks:[
  B("Workout","EMOM 12 minutes",["Odd minutes: 5 thrusters (95 lb)","Even minutes: 6 pull-ups"],emom(12,["5 thrusters","6 pull-ups"])),
  B("Finisher","3 rounds",["15 kettlebell swings","20 sit-ups"])]},
 {id:"t13", title:"Kettlebell flow", sub:"Twenty minutes with one bell.", blocks:[
  B("Workout","AMRAP 20 minutes (40 lb)",["10 kettlebell swings","10 goblet squats","5 clean and press each arm","50 single-unders"],amrap(20))]},
 {id:"t14", title:"Clean and burpee", sub:"Heavy-ish doubles, then a sprint.", blocks:[
  B("Power clean","EMOM 10 minutes",["2 power cleans, moderately heavy"],emom(10,["2 power cleans"])),
  B("Workout","21-15-9 for time, 12 minute cap",["Power cleans (75 lb)","Burpees"],ft(12))]},
 {id:"t15", title:"Snatch and swing", sub:"Light, fast snatches, then a short burner.", blocks:[
  B("Power snatch","EMOM 12 minutes",["1 power snatch plus 2 hang power snatches","Light, fast, and clean"],emom(12,["1 power snatch + 2 hang snatches"])),
  B("Workout","AMRAP 8 minutes",["10 kettlebell snatches (5 each arm)","10 push-ups","10 air squats"],amrap(8))]},
 {id:"t16", title:"Rows and rope", sub:"Four rounds, steady pace.", blocks:[
  B("Workout","4 rounds for time, 16 minute cap",["10 barbell rows (95 lb)","10 kettlebell swings","10 burpees","40 single-unders"],ft(16))]},
 {id:"t17", title:"Push press intervals", sub:"Work, rope, rest, six times.", blocks:[
  B("Workout","6 rounds of 3 minutes",["Minute 1: max push presses (75 lb)","Minute 2: jump rope","Minute 3: rest"],emom(18,["Max push presses","Jump rope","Rest"]),"Log total push presses.")]},
 {id:"t18", title:"Clusters", sub:"Squat clean thrusters, then alternating Tabata.", blocks:[
  B("Cluster","EMOM 10 minutes",["2 clusters (squat clean into a thruster), 75–95 lb"],emom(10,["2 clusters"])),
  B("Finisher","Tabata, 8 minutes",["Alternate kettlebell swings and push-ups every round"],tab(["Kettlebell swings","Push-ups"],{rounds:16,alt:true}))]},
 {id:"t19", title:"Thruster ladder", sub:"Keep climbing for ten minutes.", blocks:[
  B("Workout","AMRAP 10 minutes, ascending ladder",["1 thruster and 1 pull-up, then 2 and 2, then 3 and 3, and keep climbing","Thrusters at 75 lb"],amrap(10),"Log the last full rung you finished.")]},
 {id:"t20", title:"Long grind", sub:"Twenty minutes, nothing too heavy.", blocks:[
  B("Workout","AMRAP 20 minutes",["5 deadlifts (135 lb)","10 push-ups","15 kettlebell swings","5 pull-ups"],amrap(20))]}
];
const TUE_TEST = [
 {id:"tb1", title:"Fran", sub:"The classic thruster and pull-up benchmark.", blocks:[
  B("Benchmark","21-15-9 for time, 12 minute cap",["Thrusters (65–95 lb)","Pull-ups"],ft(12),"Log your time and weight. Fran comes back every few months.")]},
 {id:"tb2", title:"Garage Grace", sub:"Thirty clean and jerks, as fast as you can.", blocks:[
  B("Benchmark","For time, 10 minute cap",["30 clean and jerks (75 lb)","Single reps, reset between each"],ft(10))]},
 {id:"tb3", title:"Garage Isabel", sub:"Thirty power snatches for time.", blocks:[
  B("Benchmark","For time, 10 minute cap",["30 power snatches (65 lb)"],ft(10))]},
 {id:"tb4", title:"Scaled DT", sub:"Five rounds with one barbell.", blocks:[
  B("Benchmark","5 rounds for time, 15 minute cap",["12 deadlifts","9 hang power cleans","6 push presses","All at 75 lb"],ft(15))]},
 {id:"tb5", title:"Swing test", sub:"Four minutes of all-out swings.", blocks:[
  B("Benchmark","Tabata, 4 minutes",["Kettlebell swings (40 lb), 20 sec on, 10 sec off"],tab(["Kettlebell swings"]),"Score is your total swings."),
  B("Then","3 easy rounds",["10 goblet squats","10 push-ups"])]},
 {id:"tb6", title:"Thruster test", sub:"Short and fast.", blocks:[
  B("Benchmark","21-15-9 for time, 12 minute cap",["Thrusters (65–95 lb)","Burpees"],ft(12))]}
];

/* ---------- Thursday pool: bodyweight ---------- */
const THU = [
 {id:"b1", title:"Bodyweight chipper", sub:"Five rounds for time, then a plank finisher.", blocks:[
  B("Workout","5 rounds for time, 25 minute cap",["10 burpees","8 pull-ups","8 Bulgarian split squats each leg (back foot on bench)","15 sit-ups","50 single-unders"],ft(25)),
  B("Finisher","Tabata, 4 minutes",["Plank hold"],tab(["Plank"]))]},
 {id:"b2", title:"Four-station EMOM", sub:"Twenty minutes, a new station every minute.", blocks:[
  B("Workout","EMOM 20 minutes (5 rounds)",["Minute 1: 10 burpees","Minute 2: 5 pull-ups","Minute 3: 12 push-ups","Minute 4: 40 jump rope"],emom(20,["10 burpees","5 pull-ups","12 push-ups","40 jump rope"])),
  B("Finisher","Tabata, 4 minutes",["Mountain climbers"],tab(["Mountain climbers"]))]},
 {id:"b3", title:"Cindy-style AMRAP", sub:"Twenty minutes of steady rounds.", blocks:[
  B("Workout","AMRAP 20 minutes",["5 pull-ups","10 push-ups","6 Bulgarian split squats each leg","15 sit-ups"],amrap(20),"Log rounds plus extra reps.")]},
 {id:"b4", title:"Tabata ladder", sub:"Four Tabatas, one minute rest between.", blocks:[
  B("Workout","4 Tabatas (20 on, 10 off, 8 rounds each)",["Jump rope","Pull-ups (or jumping pull-ups)","Jump squats","Sit-ups","1 minute rest between each"],tab(["Jump rope","Pull-ups","Jump squats","Sit-ups"],{sets:4}),"Log your lowest round for each.")]},
 {id:"b5", title:"Death by pull-ups", sub:"Add one rep every minute until you can’t.", blocks:[
  B("Workout","EMOM until you can’t finish the minute",["Minute 1: 1 pull-up","Minute 2: 2 pull-ups","Add 1 more every minute"],emom(20,range(20,i=>(i+1)+(i?" pull-ups":" pull-up"))),"Log the last minute you completed."),
  B("Then","3 rounds",["20 air squats","15 sit-ups"])]},
 {id:"b6", title:"Rope and sit-ups", sub:"A descending ladder for time.", blocks:[

const MON_PUSH = ["Every 8 minutes, go hard for 1 minute","5 rounds of 2 minutes brisk, 2 minutes easy","Hold a strong pace for the last 10 minutes","Every 5 minutes, go fast for 30 seconds"];
const MON_MIN = [[30,35,40,30],[35,40,45,30],[35,40,45,30],[40,45,50,30],[40,45,50,30]];

function phaseOf(b){ return b < 12 ? Math.floor(b/3) : 4; }

function monday(b, w){
  const m = MON_MIN[phaseOf(b)][w];
  if(w===0) return {id:"m0", title:"Easy cardio", sub:m+" minutes at a pace you could talk through.", blocks:[

    B("Intervals",m+" minutes",["Elliptical or brisk walk", MON_PUSH[b % 4]],cd(m)),
    B("Cooldown","5 minutes",["Easy pace and a full-body stretch"])]};
  if(w===2) return {id:"m2", title:"Long and steady", sub:m+" minutes, your longest of the block.", blocks:[
    B("Steady state",m+" minutes",["Elliptical or walk","Even pace from start to finish"],cd(m)),
    B("Cooldown","5 minutes",["Hamstring and hip stretch, 45 sec each side"])]};

const FINISH = [

const PLATE_NOTE = "Your plates top out at 285 lb. Once that’s easy, add reps or a 3-second lowering instead.";

function friday(b, w){
  const ph = phaseOf(b), warmup = B("Warm-up","8 minutes",["5 min jump rope","Empty bar: 10 squats, 10 presses, 10 good mornings","5 scap pull-ups"]);
  if(ph === 4){
    if(w===2) return {id:"f-test", title:"Heavy single day", sub:"Find your best single on three lifts.", blocks:[warmup,
      B("Back squat","Work up to a heavy single",["Singles, adding weight until the next one would be a grind","Set the safety arms first"]),
      B("Bench press","Work up to a heavy single",["Same approach, safeties set just below your chest"]),
      B("Deadlift","Work up to a heavy single",["Stop at the first rep that slows down a lot"],null,PLATE_NOTE),
      B("Strict pull-ups","1 set",["Max strict reps"],null,"Log all four numbers. Next year starts from them.")]};
    if(w===3) return deload(b, LIFTS[0], "Year-end deload");
    const sch = w===0 ? "5 × 5" : "5 × 3";
    return {id:"f-t"+w, title: w===0 ? "Fives, all three lifts" : "Triples, all three lifts", sub:"Heavy work before test day.", blocks:[warmup,
      B("Back squat",sch,["Close to your best weights of the year","Rest 3 min"]),
      B("Bench press",sch,["Rest 3 min"]),
      B("Deadlift", w===0 ? "3 × 5" : "3 × 3",["Reset each rep"],null,PLATE_NOTE),
      B("Strict pull-ups","3 sets",["As many strict reps as you can"])]};
  }
  const L = LIFTS[ph], pos = b % 3;
  if(w===3) return deload(b, L, "Deload day");
  const sch = ["4 × 8","5 × 5","5 × 3"][pos], rest = ["Rest 90 sec","Rest 2–3 min","Rest 3 min"][pos];
  const step = ["Start at a weight where every rep is clean","Last week’s weight plus 5–10 lb","Last week’s weight plus another 5–10 lb"][w];
  const pulls = [B("Strict pull-ups","3 sets",["As many strict reps as you can, rest 2 min"]),
                 B("Strict pull-ups","5 × 3–5",["Lower slowly, about 3 seconds each rep"]),
                 B("Strict pull-ups","EMOM 8 minutes",["3 strict pull-ups every minute"],emom(8,["3 strict pull-ups"]))][pos];
  return {id:"f"+ph+pos+w, title:L.a+" and "+L.b.toLowerCase(), sub:["Sets of eight.","Fives, a little heavier than last week.","Heavy triples."][pos], blocks:[warmup,
    B(L.a, sch, [step, rest], null, L.a==="Deadlift" ? PLATE_NOTE : (w===0 ? "Write down your weights. Next week builds from them." : undefined)),
    B(L.b, sch, [step.replace("5–10","5"), rest]),
    L.acc, pulls, FINISH[(b+w) % 4]]};
}
function deload(b, L, title){
  return {id:"fd", title, sub:"Lighter weight, perfect reps.", blocks:[
    B("Warm-up","8 minutes",["5 min jump rope","Empty bar: 10 squats, 10 presses"]),
    B(L.a,"3 × 5",["About 80% of last week’s weight"]),
    B(L.b,"3 × 5",["About 80% of last week’s weight"]),
    B("Strict pull-ups","2 sets",["About half your max reps"]),
    B("Kettlebell swings","3 × 15",["Rest 60 sec"])]};
}

const CACHE = {};
function workout(week, d){
  const ck = week+"-"+d; if(CACHE[ck]) return CACHE[ck];
  const b = Math.floor(week/4), w = week % 4, n = b*3 + w;
  let wo;
  if(d===0) wo = monday(b, w);
  else if(d===1) wo = w===3 ? TUE_TEST[b % 6] : TUE[n % 20];
  else if(d===2) wo = w===3 ? YOGA_LONG : YOGA[n % 7];
  else if(d===3) wo = w===3 ? THU_TEST[b % 6] : THU[(n + 7) % 20];
  else wo = friday(b, w);
  if(d===1 || d===3){
    const type = d===1 ? "barbell" : "body";
    wo = Object.assign({}, wo, {blocks:[warm(type, n)].concat(wo.blocks.map(x => {
      if(!x.note && x.lines.some(l => /pull-ups?\b/i.test(l) && !/strict/i.test(l))) return Object.assign({}, x, {note:"Short on pull-ups? Use jumping pull-ups or slow lowering reps."});
      return x;
    }))});
  }
  return CACHE[ck] = wo;
}
function weekFocus(week){
  const b = Math.floor(week/4), w = week % 4;
  if(b===12) return ["Heavy fives before testing.","Heavy triples before testing.","Test day on Friday: find your best singles.","Deload. A new year starts next week."][w];
  return w===3 ? POS_FOCUS[3] : POS_FOCUS[b % 3];
}

const LS_KEY = "garage-wod-v2";
let store = {start:"2026-11-02", done:{}, results:{}, ids:{}};
try{
  const raw = localStorage.getItem(LS_KEY);
  if(raw) store = Object.assign(store, JSON.parse(raw));
  else { const old = JSON.parse(localStorage.getItem("garage-wod-v1") || "null"); if(old && old.start) store.start = old.start; }
}catch(e){}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }

/* ---------- dates ---------- */
const DAY = 86400000;
function parseDate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function mondayOf(dt){ const d = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()); d.setDate(d.getDate() - (d.getDay()+6)%7); return d; }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function where(dt){
  const wd = (dt.getDay()+6)%7;
  const weeks = Math.round((mondayOf(dt) - mondayOf(parseDate(store.start))) / (7*DAY));
  return {week: ((weeks % 52) + 52) % 52, day: wd <= 4 ? wd : null, cycle: Math.floor(Math.max(weeks,0)/52) + 1, before: weeks < 0};
}
const keyOf = (week, d, c) => "y"+c+"w"+(week+1)+"d"+(d+1);
const orderOf = k => { const m = k.match(/y(\d+)w(\d+)d(\d+)/); return m ? (+m[1])*1000 + (+m[2])*10 + (+m[3]) : 0; };
function lastResult(id, except){
  let best = null;
  for(const k in store.results){
    if(k === except || store.ids[k] !== id || !store.results[k]) continue;
    if(orderOf(k) < orderOf(except) && (!best || orderOf(k) > orderOf(best))) best = k;
  }
  return best ? store.results[best] : null;
}

/* ---------- views ---------- */
const app = document.getElementById("app");
let view = {mode:"today"};
const plateHTML = (type, text, hollow) => `<div class="plate ${TYPES[type].cls}${hollow?" hollow":""}">${text?`<div class="tick">${text}</div>`:""}</div>`;
const shareIcon = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>';
const playIcon = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function workoutHTML(week, d, label, cycle){
  const wo = workout(week, d), type = DAYTYPES[d], k = keyOf(week, d, cycle), done = !!store.done[k];
  const prev = lastResult(wo.id, k);
  let h = `<section class="hero"><div><div class="when">${label}</div><h1>${wo.title}</h1><div class="sub">${wo.sub}</div></div>
    <div class="plate big ${TYPES[type].cls}"><div class="tick">${DAYNAMES[d].slice(0,3)}</div></div></section>`;
  wo.blocks.forEach((b, i) => {
    h += `<article class="block ${TYPES[type].cls}"><h2>${b.name}</h2><p class="fmt">${b.fmt}</p><ul>${b.lines.map(l=>`<li>${l}</li>`).join("")}</ul>`;
    if(b.note) h += `<p class="note">${b.note}</p>`;
    if(b.timer) h += `<button class="go" data-timer="${week}-${d}-${i}">${playIcon}Start timer</button>`;
    h += `</article>`;
  });
  h += `<section class="log ${TYPES[type].cls}"><label for="res">Your result</label>
    <input id="res" placeholder="Time, rounds, or weights used" autocomplete="off">
    ${prev ? `<p class="last">Last time you did this: ${esc(prev)}</p>` : ""}
    <div class="row"><button class="done-btn" id="doneBtn" aria-pressed="${done}">${done?"Completed":"Mark complete"}</button></div>
    ${done ? `<button class="share-btn" id="shareBtn">${shareIcon}Make share card</button>` : ""}
    <div class="saved" id="savedMsg" aria-live="polite"></div></section>`;
  return {h, k, id:wo.id, week, d};
}
function stripHTML(week, cur, cycle){
  return `<nav class="strip" aria-label="This week">` + DAYTYPES.map((t, d) => {
    const done = store.done[keyOf(week, d, cycle)];
    return `<button class="mini" data-open="${week}-${d}" aria-current="${d===cur}" aria-label="${DAYNAMES[d]}${done?", completed":""}">${plateHTML(t, done?"✓":"", !done)}<span>${DAYNAMES[d].slice(0,3)}</span></button>`;
  }).join("") + `</nav>`;
}
const weekLabel = week => "Week "+(week+1)+" of 52";

function render(){
  document.getElementById("tabToday").setAttribute("aria-pressed", view.mode!=="plan");
  document.getElementById("tabPlan").setAttribute("aria-pressed", view.mode==="plan");
  const here = where(new Date()), cycle = here.cycle, curWeek = here.before ? 0 : here.week;
  let html = "", r = null;

  if(view.mode === "plan"){
    const blk = view.block != null ? view.block : Math.floor(curWeek/4);
    view.block = blk;
    html += `<div class="blocknav"><button id="prevB" aria-label="Previous block" ${blk===0?"disabled":""}>‹</button>
      <div><b>Block ${blk+1} of 13</b><small>${PHASES[phaseOf(blk)]} phase, weeks ${blk*4+1}–${blk*4+4}</small></div>
      <button id="nextB" aria-label="Next block" ${blk===12?"disabled":""}>›</button></div>`;
    for(let w = 0; w < 4; w++){
      const week = blk*4 + w;
      html += `<section class="week"><h2>Week ${week+1}</h2><p class="focus">${weekFocus(week)}</p>`;
      DAYTYPES.forEach((t, d) => {
        const done = store.done[keyOf(week, d, cycle)], isToday = !here.before && here.week===week && here.day===d;
        html += `<button class="day" data-open="${week}-${d}" aria-current="${isToday}">${plateHTML(t, done?"✓":"", !done)}<div><b>${DAYNAMES[d]}: ${workout(week,d).title}</b><small>${TYPES[t].label}</small></div></button>`;
      });
      html += `</section>`;
    }
    html += `<section class="settings"><label for="startIn">Week 1 starts on</label><input type="date" id="startIn" value="${store.start}">
      <p>Pick a Monday. The 52 weeks repeat after that, and you’re in year ${cycle}.</p></section>`;
    app.innerHTML = html;
    document.getElementById("prevB").onclick = () => { view.block = Math.max(0, blk-1); render(); };
    document.getElementById("nextB").onclick = () => { view.block = Math.min(12, blk+1); render(); };
    const si = document.getElementById("startIn");
    si.addEventListener("change", () => { if(si.value){ store.start = ymd(mondayOf(parseDate(si.value))); save(); view.block = null; render(); } });
  } else if(view.mode === "detail"){
    r = workoutHTML(view.week, view.d, weekLabel(view.week)+", "+DAYNAMES[view.d], cycle);
    app.innerHTML = `<button class="back" id="backBtn">‹ Back</button>` + stripHTML(view.week, view.d, cycle) + r.h;
    document.getElementById("backBtn").onclick = () => { view = {mode:view.from||"today", block:view.block}; render(); };
  } else if(here.day === null && !here.before){
    const next = (curWeek + 1) % 52;
    app.innerHTML = stripHTML(curWeek, -1, cycle) + `<section class="rest"><h2>Rest day</h2><p>Nothing scheduled today. Monday is <b>${workout(next,0).title.toLowerCase()}</b>.</p><button class="link" data-open="${next}-0">Preview Monday</button></section>`;
  } else {
    const d = here.before ? 0 : here.day;
    r = workoutHTML(curWeek, d, here.before ? "Your first workout" : weekLabel(curWeek)+", today", cycle);
    app.innerHTML = stripHTML(curWeek, d, cycle) + r.h;
  }

  app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => {
    const [week, d] = b.dataset.open.split("-").map(Number);
    view = {mode:"detail", week, d, from: view.mode==="plan" ? "plan" : (view.from||"today"), block:view.block};
    render(); window.scrollTo(0,0);
  });
  app.querySelectorAll("[data-timer]").forEach(b => b.onclick = () => {
    const [week, d, i] = b.dataset.timer.split("-").map(Number), wo = workout(week, d);
    openTimer(wo, wo.blocks[i], DAYTYPES[d]);
  });
  if(r){
    const k = r.k, res = document.getElementById("res"), btn = document.getElementById("doneBtn"), msg = document.getElementById("savedMsg");
    res.value = store.results[k] || "";
    res.addEventListener("input", () => { store.results[k] = res.value; store.ids[k] = r.id; save(); msg.textContent = "Result saved"; });
    btn.onclick = () => {
      if(store.done[k]) delete store.done[k]; else { store.done[k] = true; store.ids[k] = r.id; }
      save(); render();
      const m = document.getElementById("savedMsg"); if(m) m.textContent = store.done[k] ? "Nice work. Marked complete." : "Marked not complete.";
    };
    const sb = document.getElementById("shareBtn");
    if(sb) sb.onclick = () => openShare(r.week, r.d, cycle);
  }
}
document.getElementById("tabToday").onclick = () => { view = {mode:"today"}; render(); };
document.getElementById("tabPlan").onclick = () => { view = {mode:"plan"}; render(); };

/* ---------- timer ---------- */
const T = {el:document.getElementById("timer"), clock:document.getElementById("tClock"), phase:document.getElementById("tPhase"), meta:document.getElementById("tMeta"), title:document.getElementById("tTitle"), start:document.getElementById("tStart")};
let tm = null, raf = null, actx = null, wake = null;
const PREP = 10;
function beep(freq, dur){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.type = "square"; g.gain.value = .08;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
function totalOf(t){
  if(t.mode==="amrap"||t.mode==="countdown"||t.mode==="emom") return t.min*60;
  if(t.mode==="fortime") return t.cap*60;
  return t.sets*t.rounds*(t.work+t.rest) + (t.sets-1)*t.setRest;
}
function stateAt(t, e){
  if(e < 0) return {clock:-e, phase:"Get ready", meta:"", cue:"prep"};
  const total = totalOf(t);
  if(e >= total) return {clock:0, phase:"Time", meta: t.mode==="fortime" ? "Time cap reached" : "Done", done:true};
  if(t.mode==="amrap"||t.mode==="countdown") return {clock:total-e, phase: t.mode==="amrap" ? "As many rounds as possible" : "Keep moving", meta:fmt(e)+" elapsed", cue:"down"};
  if(t.mode==="fortime") return {clock:e, up:true, phase:"Go", meta:"Cap "+t.cap+":00", cue:"up"};
  if(t.mode==="emom"){
    const ev = t.every, n = Math.floor(e/ev), count = Math.round(t.min*60/ev);
    return {clock: ev - (e % ev), phase: t.stations[n % t.stations.length], meta:(ev===60?"Minute ":"Round ")+(n+1)+" of "+count, slot:n, cue:"down"};
  }
  const cyc = t.work + t.rest, setLen = t.rounds*cyc;
  let x = e, set = 0;
  while(set < t.sets-1 && x >= setLen + t.setRest){ x -= setLen + t.setRest; set++; }
  if(x >= setLen) return {clock: setLen + t.setRest - x, phase:"Rest", meta:"Next: "+t.labels[(set+1) % t.labels.length], slot:"r"+set, cue:"down"};
  const r = Math.floor(x/cyc), inR = x % cyc, working = inR < t.work;
  const label = t.alt ? t.labels[r % t.labels.length] : t.labels[set % t.labels.length];
  return {clock: working ? t.work-inR : cyc-inR, phase: working ? label : "Rest", meta:"Round "+(r+1)+" of "+t.rounds+(t.sets>1 ? ", set "+(set+1)+" of "+t.sets : ""), slot:set+"-"+r+"-"+(working?"w":"r"), cue:"down"};
}
const elapsed = () => tm.acc + (tm.running ? (performance.now()-tm.t0)/1000 : 0) - PREP;
function tick(){
  const e = elapsed(), s = stateAt(tm.spec, e);
  T.clock.textContent = fmt(s.up ? Math.floor(s.clock) : s.clock);
  T.phase.textContent = s.phase; T.meta.textContent = s.meta;
  const sec = Math.ceil(s.clock);
  if(tm.running){
    if(e >= 0 && tm.lastE < 0) beep(880,.45);
    else if(s.slot !== undefined && tm.lastSlot !== undefined && s.slot !== tm.lastSlot) beep(880,.35);
    else if(sec !== tm.lastSec && sec <= 3 && sec > 0 && (s.cue==="prep" || (s.cue==="down" && (s.slot !== undefined || s.clock < 4)))) beep(520,.1);
    if(s.done){ beep(660,.6); tm.running = false; T.start.textContent = "Start"; releaseWake(); }
  }
  tm.lastSlot = s.slot; tm.lastSec = sec; tm.lastE = e;
  if(tm.running) raf = requestAnimationFrame(tick);
}
async function holdWake(){ try{ if("wakeLock" in navigator) wake = await navigator.wakeLock.request("screen"); }catch(e){} }
function releaseWake(){ try{ wake && wake.release(); }catch(e){} wake = null; }
function openTimer(wo, block, type){
  tm = {spec:block.timer, acc:0, running:false, t0:0};
  T.el.className = "timer on " + TYPES[type].cls;
  T.title.textContent = wo.title + ": " + block.name + " (" + block.fmt + ")";
  T.start.textContent = "Start"; tick(); T.start.focus();
}
T.start.onclick = () => {
  if(!tm) return;
  if(tm.running){ tm.acc += (performance.now()-tm.t0)/1000; tm.running = false; T.start.textContent = "Resume"; cancelAnimationFrame(raf); releaseWake(); }
  else { if(stateAt(tm.spec, elapsed()).done) tm.acc = 0; tm.t0 = performance.now(); tm.running = true; T.start.textContent = "Pause"; beep(1,.01); holdWake(); tick(); }
};
document.getElementById("tReset").onclick = () => { if(!tm) return; cancelAnimationFrame(raf); tm = {spec:tm.spec, acc:0, running:false, t0:0}; T.start.textContent = "Start"; releaseWake(); tick(); };
document.getElementById("tClose").onclick = () => { cancelAnimationFrame(raf); if(tm) tm.running = false; releaseWake(); T.el.className = "timer"; };
document.addEventListener("keydown", e => { if(e.key==="Escape" && T.el.classList.contains("on")) document.getElementById("tClose").click(); });

/* ---------- share card ---------- */
const CARD_COLORS = {movement:"#3FA86D", barbell:"#4A86D8", yoga:"#CFCBBE", body:"#EDBC3A", heavy:"#E0484E"};
const TAGLINES = {
  movement:["Miles in the bank.","Easy day, done right.","Motion is lotion."],
  barbell:["Barbell 0, me 1.","Chalk dust settled.","Thrusters were thrust."],
  yoga:["Bendier than yesterday.","Stretched and unbothered.","Hips: opened."],
  body:["No equipment, no excuses.","Bodyweight, full effort.","Burpees survived."],
  heavy:["Heavy things were lifted.","Iron moved.","Plates loaded, plates conquered."]
};
function dateOf(week, d, cycle){ const s = parseDate(store.start); s.setDate(s.getDate() + ((cycle-1)*52 + week)*7 + d); return s; }
function streakAt(week, d, cycle){
  let n = 0, w = week, dd = d, c = cycle;
  while(store.done[keyOf(w, dd, c)]){
    n++; dd--;
    if(dd < 0){ dd = 4; w--; if(w < 0){ w = 51; c--; if(c < 1) break; } }
  }
  return n;
}
function yearCount(cycle){ return Object.keys(store.done).filter(k => k.startsWith("y"+cycle+"w")).length; }
function cardLines(wo, d){
  const skip = /^(Warm-up|Cooldown|Mobility)$/;
  const blocks = wo.blocks.filter(b => !skip.test(b.name));
  if(d === 4) return {fmt:"Strength session", lines:blocks.map(b => b.name+": "+b.fmt)};
  const main = blocks.find(b => /^(Workout|Benchmark|Test|Steady state|Intervals|Long|Holds|Flow)$/.test(b.name)) || blocks[blocks.length-1] || wo.blocks[0];
  return {fmt:main.fmt, lines:main.lines};
}
function wrap(ctx, text, maxW){
  const words = String(text).split(/\s+/), out = []; let line = "";
  for(const w of words){ const t = line ? line+" "+w : w; if(ctx.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t; }
  if(line) out.push(line); return out;
}
function plate(ctx, x, y, r, color, filled){
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  if(filled){ ctx.fillStyle = color; ctx.fill(); } else { ctx.lineWidth = r*.16; ctx.strokeStyle = color; ctx.beginPath(); ctx.arc(x, y, r - r*.08, 0, Math.PI*2); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(x, y, r*.68, 0, Math.PI*2); ctx.lineWidth = Math.max(2, r*.04); ctx.strokeStyle = filled ? "rgba(255,255,255,.35)" : color; ctx.globalAlpha = filled ? 1 : .4; ctx.stroke(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(x, y, r*.2, 0, Math.PI*2); ctx.fillStyle = "#171B21"; ctx.fill();
  ctx.restore();
}
async function buildCard(week, d, cycle){
  try{ await Promise.all([document.fonts.load('800 120px "Barlow Condensed"'), document.fonts.load('700 60px "Barlow Condensed"'), document.fonts.load('600 40px Barlow'), document.fonts.load('400 40px Barlow')]); }catch(e){}
  const W = 1080, H = 1350, P = 80, type = DAYTYPES[d], col = CARD_COLORS[type];
  const wo = workout(week, d), k = keyOf(week, d, cycle), res = (store.results[k] || "").trim(), prev = lastResult(wo.id, k);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d"), CD = '"Barlow Condensed","Arial Narrow",sans-serif', BD = 'Barlow,"Segoe UI",Roboto,Arial,sans-serif';
  const ink = "#E9EDF1", muted = "#9AA4B0", dark = "#1D232B";

  ctx.fillStyle = "#171B21"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = col; ctx.fillRect(0, 0, W, 14);
  plate(ctx, W - 40, 250, 300, col, true);

  ctx.fillStyle = ink; ctx.font = "700 34px "+CD; ctx.textBaseline = "alphabetic";
  ctx.fillText("MACLEOD HIIT GARAGE", P, 110);
  const dt = dateOf(week, d, cycle);
  ctx.fillStyle = muted; ctx.font = "500 32px "+BD;
  ctx.fillText(dt.toLocaleDateString("en-US", {weekday:"long", month:"short", day:"numeric", year:"numeric"}), P, 160);
  ctx.fillText("Week "+(week+1)+" of 52, "+PHASES[phaseOf(Math.floor(week/4))]+" phase", P, 204);

  ctx.fillStyle = ink;
  let y = 360, fs = 132, tl;
  for(fs of [132, 112, 96, 84]){ ctx.font = "800 "+fs+"px "+CD; tl = wrap(ctx, wo.title.toUpperCase(), W - P*2 - 120); if(tl.length <= 2) break; }
  tl = tl.slice(0, 2);
  tl.forEach(l => { ctx.fillText(l, P, y); y += fs*.9; });
  y -= 30;
  ctx.fillStyle = col; ctx.font = "700 40px "+CD;
  ctx.fillText(TYPES[type].label.toUpperCase(), P, y + 30); y += 70;

  // result box
  const boxY = y, boxH = prev ? 230 : 190;
  ctx.fillStyle = col; roundRect(ctx, P, boxY, W - P*2, boxH, 26); ctx.fill();
  const onCol = (type === "yoga" || type === "body") ? dark : "#FFFFFF";
  ctx.fillStyle = onCol; ctx.globalAlpha = .8; ctx.font = "700 30px "+CD; ctx.fillText("RESULT", P + 36, boxY + 58); ctx.globalAlpha = 1;
  ctx.font = "800 84px "+CD;
  let rl = wrap(ctx, res || "Done.", W - P*2 - 72);
  if(rl.length > 1){ ctx.font = "800 60px "+CD; rl = wrap(ctx, res, W - P*2 - 72).slice(0, 2); }
  rl.forEach((l, i) => ctx.fillText(l, P + 36, boxY + (rl.length > 1 ? 118 + i*60 : 140)));
  if(prev){ ctx.font = "600 30px "+BD; ctx.globalAlpha = .85; ctx.fillText(("Last time: "+prev).slice(0, 60), P + 36, boxY + boxH - 30); ctx.globalAlpha = 1; }
  y = boxY + boxH + 64;

  // breakdown
  const cl = cardLines(wo, d);
  ctx.fillStyle = muted; ctx.font = "700 30px "+CD; ctx.fillText(cl.fmt.toUpperCase(), P, y); y += 50;
  ctx.fillStyle = ink; ctx.font = "500 34px "+BD;
  const stop = H - 325; let used = 0;
  for(const line of cl.lines){
    if(y > stop) break;
    const parts = wrap(ctx, line, W - P*2 - 40);
    for(const p of parts){ if(y > stop) break; ctx.fillStyle = col; if(p === parts[0]) ctx.fillRect(P, y - 22, 14, 14); ctx.fillStyle = ink; ctx.fillText(p, P + 34, y); y += 46; used++; }
  }

  // stats
  const sy = H - 300, tw = (W - P*2 - 40) / 3;
  const weekDone = [0,1,2,3,4].filter(i => store.done[keyOf(week, i, cycle)]).length;
  const streak = streakAt(week, d, cycle);
  [["STREAK", streak+(streak===1?" day":" days")],["THIS WEEK", weekDone+" of 5"],["THIS YEAR", yearCount(cycle)+" done"]].forEach((s, i) => {
    const x = P + i*(tw + 20);
    ctx.fillStyle = "#222831"; roundRect(ctx, x, sy, tw, 130, 20); ctx.fill();
    ctx.fillStyle = muted; ctx.font = "700 26px "+CD; ctx.fillText(s[0], x + 26, sy + 44);
    ctx.fillStyle = ink; ctx.font = "800 52px "+CD; ctx.fillText(s[1], x + 26, sy + 104);
  });

  // week plates + tagline
  const py = H - 100;
  DAYTYPES.forEach((t, i) => plate(ctx, P + 34 + i*84, py, 32, CARD_COLORS[t], !!store.done[keyOf(week, i, cycle)]));
  const tags = TAGLINES[type], tag = tags[(week*5 + d) % tags.length];
  ctx.fillStyle = ink; ctx.font = "700 44px "+CD; ctx.textAlign = "right";
  ctx.fillText(tag, W - P, py + 16); ctx.textAlign = "left";
  return cv;
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }

const S = {el:document.getElementById("sheet"), img:document.getElementById("shareImg")};
let shareFile = null;
async function openShare(week, d, cycle){
  const cv = await buildCard(week, d, cycle);
  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  const name = "macleod-hiit-"+ymd(dateOf(week, d, cycle))+".png";
  shareFile = new File([blob], name, {type:"image/png"});
  if(S.img.src) URL.revokeObjectURL(S.img.src);
  S.img.src = URL.createObjectURL(blob);
  S.el.classList.add("on");
  const canShare = navigator.canShare && navigator.canShare({files:[shareFile]});
  document.getElementById("sShare").style.display = canShare ? "" : "none";
}
document.getElementById("sShare").onclick = async () => { try{ await navigator.share({files:[shareFile], title:"MacLeod HIIT Garage"}); }catch(e){} };
document.getElementById("sSave").onclick = () => { const a = document.createElement("a"); a.href = S.img.src; a.download = shareFile.name; document.body.appendChild(a); a.click(); a.remove(); };
document.getElementById("sClose").onclick = () => S.el.classList.remove("on");
document.addEventListener("keydown", e => { if(e.key==="Escape" && S.el.classList.contains("on")) S.el.classList.remove("on"); });

render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
